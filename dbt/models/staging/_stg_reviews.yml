version: 2

models:
  - name: stg_reviews
    description: Cleaned and type-cast reviews. One row per review.
    columns:
      - name: review_id
        description: Unique Amazon review ID.
        data_tests: [unique, not_null]
      - name: category
        description: Product category (which TSV file the review came from).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Books', 'Music', 'Video_DVD', 'Digital_Ebook']
      - name: star_rating
        description: Star rating given by the customer (1 to 5). This is the prediction target.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: review_date
        description: Date the review was written.
        data_tests: [not_null]
      - name: review_text
        description: Lowercased headline + body with HTML removed. This is the model input.
        data_tests: [not_null]
