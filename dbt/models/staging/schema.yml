version: 2

models:
  - name: stg_reviews
    description: Typed and lightly filtered reviews. One row per review.
    columns:
      - name: review_id
        description: Amazon review identifier.
        tests:
          - not_null
          - unique
      - name: category
        description: Product category the review came from.
        tests:
          - not_null
          - accepted_values:
              values: ['Books', 'Music', 'Video_DVD', 'Digital_Ebook']
      - name: star_rating
        description: Star rating given by the customer (1 to 5).
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false
      - name: review_year
        description: Year of the review.
        tests:
          - not_null
      - name: review_text
        description: Cleaned headline plus body (lowercase, HTML removed).
        tests:
          - not_null
